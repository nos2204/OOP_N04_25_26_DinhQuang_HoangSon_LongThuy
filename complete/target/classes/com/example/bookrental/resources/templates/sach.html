<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Danh sách Sách cho thuê</title>
</head>
<body>
  <h1>Danh sách Sách</h1>
  <form th:action="@{/sach/add}" method="post">
    <input type="text" name="tenSach" placeholder="Tên sách" required>
    <input type="text" name="tacGia" placeholder="Tác giả" required>
    <input type="number" step="0.1" name="giaThue" placeholder="Giá thuê" required>
    <button type="submit">Thêm sách</button>
  </form>

  <table border="1">
    <tr>
      <th>ID</th><th>Tên</th><th>Tác giả</th><th>Giá thuê</th><th>Hành động</th>
    </tr>
    <tr th:each="sach : ${sachs}">
      <td th:text="${sach.id}"></td>
      <td th:text="${sach.tenSach}"></td>
      <td th:text="${sach.tacGia}"></td>
      <td th:text="${sach.giaThue}"></td>
      <td>
        <a th:href="@{/sach/delete/{id}(id=${sach.id})}">Xóa</a>
      </td>
    </tr>
  </table>
</body>
</html>
